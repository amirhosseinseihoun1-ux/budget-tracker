<!-- Monthly Budget Tracker -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#f4efe6;
    --bg-2:#efe8db;
    --ink:#211e1a;
    --ink-soft:#6b6357;
    --ink-faint:#9a917f;
    --card:#fbf8f2;
    --line:#e3dccd;
    --line-strong:#d5cbb6;
    --accent:#2f6f5e;
    --accent-soft:#e2ede9;
    --warn:#c2703d;
    --danger:#a8453c;
    --shadow:0 1px 2px rgba(33,30,26,.04),0 8px 24px -12px rgba(33,30,26,.18);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 80% at 100% 0%, #f8f2e7 0%, transparent 60%),
      radial-gradient(120% 80% at 0% 100%, #efe7d8 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Hanken Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 120px;}
  .mono{font-family:'Spline Sans Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--accent);position:relative;flex:none}
  .brand .dot:after{content:"";position:absolute;inset:8px 9px;border-left:2.5px solid #fbf8f2;border-bottom:2.5px solid #fbf8f2;transform:rotate(-12deg)}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-size:17px;cursor:pointer;display:grid;place-items:center}
  .icon-btn:active{transform:scale(.95)}

  /* month switch */
  .month{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 16px}
  .month button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
  .month button:active{transform:scale(.92)}
  .month .label{font-family:'Fraunces',serif;font-size:20px;font-weight:500;min-width:168px;text-align:center}

  /* hero summary */
  .hero{background:linear-gradient(160deg,#2f6f5e,#27604f);color:#f4efe6;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
  .hero .lab{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
  .hero .big{font-family:'Spline Sans Mono',monospace;font-size:38px;font-weight:600;letter-spacing:-.03em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .hero .sub{font-size:13.5px;opacity:.82}
  .hero .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:16px;overflow:hidden}
  .hero .bar i{display:block;height:100%;border-radius:6px;background:#f4efe6;transition:width .5s ease}
  .hero.over .bar i{background:#f2c4a3}

  /* stat row */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
  .stat .lab{font-size:12px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
  .stat .val{font-family:'Spline Sans Mono',monospace;font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .stat .val.in{color:var(--accent)}
  .stat .val.out{color:var(--warn)}

  /* section headers */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 12px}
  .sec-h h2{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0}
  .sec-h .link{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;background:none;border:none}

  /* envelope cards */
  .env{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
  .env:active{transform:scale(.995)}
  .env .row1{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .env .swatch{width:11px;height:11px;border-radius:4px;flex:none}
  .env .name{font-weight:600;font-size:15px;flex:1}
  .env .amt{font-family:'Spline Sans Mono',monospace;font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .env .track{height:9px;border-radius:6px;background:var(--bg-2);overflow:hidden}
  .env .track i{display:block;height:100%;border-radius:6px;transition:width .4s ease}
  .env .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-faint)}
  .env .foot .over{color:var(--danger);font-weight:600}

  /* transactions */
  .tx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
  .tx .tag{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;font-family:'Fraunces',serif}
  .tx .mid{flex:1;min-width:0}
  .tx .mid .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .mid .s{font-size:12px;color:var(--ink-faint);margin-top:1px}
  .tx .val{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .tx .val.in{color:var(--accent)}
  .tx .del{border:none;background:none;color:var(--ink-faint);font-size:18px;cursor:pointer;padding:2px 4px}

  /* charts */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .panel h3{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin:0 0 14px}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .donut{position:relative;flex:none}
  .donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut .center .c-lab{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
  .donut .center .c-val{font-family:'Spline Sans Mono',monospace;font-size:17px;font-weight:600}
  .legend{flex:1;min-width:140px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}
  .legend .li .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .li .nm{flex:1;color:var(--ink-soft)}
  .legend .li .pc{font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:12.5px}
  .cmp{display:flex;align-items:flex-end;gap:22px;justify-content:center;height:150px;padding-top:6px}
  .cmp .col{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .cmp .col .bar{width:54px;border-radius:8px 8px 4px 4px;min-height:4px;transition:height .5s ease}
  .cmp .col .v{font-family:'Spline Sans Mono',monospace;font-size:12px;font-weight:600}
  .cmp .col .l{font-size:12px;color:var(--ink-faint)}

  /* empty */
  .empty{text-align:center;color:var(--ink-faint);padding:30px 16px;font-size:14px}
  .empty .em-emoji{font-size:30px;display:block;margin-bottom:8px;opacity:.6}

  /* tabbar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,248,242,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40}
  .tabbar button{flex:1;background:none;border:none;color:var(--ink-faint);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
  .tabbar button .ic{font-size:20px;line-height:1}
  .tabbar button.on{color:var(--accent)}
  .fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fbf8f2;border:none;font-size:30px;font-weight:300;box-shadow:0 8px 22px -6px rgba(47,111,94,.6);cursor:pointer;z-index:45;display:grid;place-items:center}
  .fab:active{transform:scale(.93)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(33,30,26,.42);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
  .scrim.show .sheet{transform:translateY(0)}
  .sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line-strong);margin:0 auto 16px}
  .sheet h3{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 16px}
  .seg{display:flex;background:var(--bg-2);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  label.fl{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:0 0 6px}
  .field{margin-bottom:14px}
  input,select{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  input.amt-in{font-family:'Spline Sans Mono',monospace;font-size:22px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line-strong);background:var(--card);border-radius:20px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
  .chip .sw{width:9px;height:9px;border-radius:3px}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .btn{width:100%;border:none;background:var(--accent);color:#fbf8f2;border-radius:13px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line-strong)}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--line-strong)}
  .row-2{display:flex;gap:10px}
  .cat-edit{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cat-edit .sw{width:14px;height:14px;border-radius:4px;flex:none}
  .cat-edit input.nm{flex:1.4}
  .cat-edit input.bd{flex:1;font-family:'Spline Sans Mono',monospace}
  .cat-edit .x{border:none;background:none;color:var(--ink-faint);font-size:20px;cursor:pointer}
  .add-cat{font-size:13.5px;color:var(--accent);font-weight:600;background:none;border:1px dashed var(--line-strong);border-radius:11px;padding:11px;width:100%;cursor:pointer;margin-top:4px}
  .note{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:14px;line-height:1.5}
  .loading{text-align:center;padding:80px 20px;color:var(--ink-faint);font-family:'Fraunces',serif;font-size:17px}
  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none!important}
</style>

<div id="app"><div class="loading">Loading your budget…</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='budget-tracker-v1';
const PALETTE=['#2f6f5e','#c2703d','#4a6fa5','#a8453c','#7b6b9e','#5e8c61','#c9a24b','#8c6e5a','#6b7280','#3d7e8c'];
const DEFAULT_CATS=[
  {id:'c1',name:'Housing',budget:0,color:PALETTE[0]},
  {id:'c2',name:'Groceries',budget:0,color:PALETTE[1]},
  {id:'c3',name:'Transport',budget:0,color:PALETTE[2]},
  {id:'c4',name:'Dining',budget:0,color:PALETTE[3]},
  {id:'c5',name:'Utilities',budget:0,color:PALETTE[4]},
  {id:'c6',name:'Fun',budget:0,color:PALETTE[5]},
  {id:'c7',name:'Health',budget:0,color:PALETTE[6]},
  {id:'c8',name:'Other',budget:0,color:PALETTE[8]},
];

let DATA=null, MEM=null;            // MEM = in-memory fallback if storage unavailable
let CUR=monthKey(new Date());        // current month being viewed
let TAB='home';
let modalCtx={};

/* ---------- storage layer (with graceful fallback) ---------- */
async function loadStore(){
  if(typeof window.storage==='undefined'){ return MEM; }
  try{ const r=await window.storage.get(KEY); return r&&r.value?JSON.parse(r.value):null; }
  catch(e){ return null; } // missing key throws -> treat as empty
}
async function saveStore(){
  if(typeof window.storage==='undefined'){ MEM=DATA; return; }
  try{ await window.storage.set(KEY,JSON.stringify(DATA)); }
  catch(e){ toast('Could not save — storage error'); }
}

/* ---------- helpers ---------- */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k){ const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function shiftMonth(k,delta){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+delta,1); return monthKey(d); }
function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmt(n){ try{ return new Intl.NumberFormat(DATA.settings.locale,{style:'currency',currency:DATA.settings.currency,maximumFractionDigits:2}).format(n||0);}catch(e){ return (DATA.settings.symbol||'€')+(n||0).toFixed(2);} }
function curMonth(){ if(!DATA.months[CUR]) DATA.months[CUR]={income:[],expenses:[]}; return DATA.months[CUR]; }
function catById(id){ return DATA.categories.find(c=>c.id===id); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- totals ---------- */
function totals(){
  const m=curMonth();
  const income=m.income.reduce((s,i)=>s+(+i.amount||0),0);
  const spent=m.expenses.reduce((s,e)=>s+(+e.amount||0),0);
  return {income,spent,left:income-spent};
}
function spentByCat(){
  const m=curMonth(); const map={};
  m.expenses.forEach(e=>{ map[e.catId]=(map[e.catId]||0)+(+e.amount||0); });
  return map;
}

/* ================= RENDER ================= */
function render(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><div class="dot"></div><h1>Ledger</h1></div>
        <button class="icon-btn" onclick="openSettings()">⚙</button>
      </div>
      <div class="month">
        <button onclick="nav(-1)">‹</button>
        <div class="label">${monthLabel(CUR)}</div>
        <button onclick="nav(1)">›</button>
      </div>
      ${TAB==='home'?viewHome():TAB==='budget'?viewBudget():TAB==='log'?viewLog():viewInsights()}
    </div>
    <button class="fab" onclick="openAdd()">+</button>
    <div class="tabbar">
      ${tabBtn('home','◰','Overview')}
      ${tabBtn('budget','▤','Budget')}
      ${tabBtn('log','≣','Activity')}
      ${tabBtn('insights','◔','Insights')}
    </div>`;
}
function tabBtn(id,ic,label){ return `<button class="${TAB===id?'on':''}" onclick="setTab('${id}')"><span class="ic">${ic}</span>${label}</button>`; }
function setTab(t){ TAB=t; render(); }
function nav(d){ CUR=shiftMonth(CUR,d); render(); }

function viewHome(){
  const t=totals();
  const m=curMonth();
  const pct=t.income>0?Math.min(t.spent/t.income*100,100):(t.spent>0?100:0);
  const over=t.left<0;
  const sbc=spentByCat();
  const tops=DATA.categories.map(c=>({c,sp:sbc[c.id]||0})).filter(x=>x.sp>0).sort((a,b)=>b.sp-a.sp).slice(0,4);
  return `
    <div class="hero ${over?'over':''}">
      <div class="lab">${over?'Over budget by':'Left to spend'}</div>
      <div class="big">${fmt(Math.abs(t.left))}</div>
      <div class="sub">${fmt(t.spent)} spent of ${fmt(t.income)} income</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="lab">Income</div><div class="val in">${fmt(t.income)}</div></div>
      <div class="stat"><div class="lab">Spent</div><div class="val out">${fmt(t.spent)}</div></div>
    </div>
    <div class="sec-h"><h2>Top spending</h2><button class="link" onclick="setTab('insights')">Insights →</button></div>
    ${tops.length?tops.map(x=>{
      const lim=x.c.budget||0; const ov=lim>0&&x.sp>lim;
      const p=lim>0?Math.min(x.sp/lim*100,100):100;
      const col=ov?'var(--danger)':p>80?'var(--warn)':x.c.color;
      return `<div class="env" onclick="setTab('budget')">
        <div class="row1"><span class="swatch" style="background:${x.c.color}"></span>
        <span class="name">${esc(x.c.name)}</span><span class="amt">${fmt(x.sp)}${lim>0?' / '+fmt(lim):''}</span></div>
        <div class="track"><i style="width:${p}%;background:${col}"></i></div>
      </div>`;}).join('')
    :`<div class="empty"><span class="em-emoji">○</span>No spending logged yet this month.<br>Tap <b>+</b> to add your first transaction.</div>`}
  `;
}

function viewBudget(){
  const sbc=spentByCat();
  const totalBudget=DATA.categories.reduce((s,c)=>s+(+c.budget||0),0);
  const rows=DATA.categories.map(c=>{
    const sp=sbc[c.id]||0; const bd=+c.budget||0;
    const p=bd>0?Math.min(sp/bd*100,100):(sp>0?100:0);
    const ov=bd>0&&sp>bd;
    const col=ov?'var(--danger)':p>80?'var(--warn)':c.color;
    const left=bd-sp;
    return `<div class="env" onclick="openCatLog('${c.id}')">
      <div class="row1"><span class="swatch" style="background:${c.color}"></span>
        <span class="name">${esc(c.name)}</span>
        <span class="amt">${fmt(sp)}${bd>0?' / '+fmt(bd):''}</span></div>
      <div class="track"><i style="width:${p}%;background:${col}"></i></div>
      <div class="foot">
        <span>${bd>0?(ov?'<span class="over">Over by '+fmt(-left)+'</span>':fmt(left)+' left'):'No budget set'}</span>
        <span>${bd>0?Math.round(sp/bd*100)+'%':''}</span>
      </div>
    </div>`;
  }).join('');
  return `
    <div class="sec-h"><h2>Envelopes</h2><button class="link" onclick="openCats()">Edit categories</button></div>
    <div class="stat" style="margin-bottom:14px"><div class="lab">Total budgeted</div><div class="val">${fmt(totalBudget)}</div></div>
    ${rows||'<div class="empty">No categories yet.</div>'}
  `;
}

function viewLog(){
  const m=curMonth();
  const items=[...m.income.map(i=>({...i,kind:'in'})),...m.expenses.map(e=>({...e,kind:'out'}))]
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `
    <div class="sec-h"><h2>Activity</h2><span class="amt mono" style="color:var(--ink-faint)">${items.length} items</span></div>
    ${items.length?items.map(it=>{
      if(it.kind==='in'){
        return `<div class="tx">
          <div class="tag" style="background:var(--accent)">+</div>
          <div class="mid"><div class="t">${esc(it.label||'Income')}</div><div class="s">${fmtDate(it.date)} · Income</div></div>
          <div class="val in">+${fmt(it.amount)}</div>
          <button class="del" onclick="delItem('in','${it.id}')">×</button>
        </div>`;
      }
      const c=catById(it.catId)||{name:'—',color:'#999'};
      return `<div class="tx">
        <div class="tag" style="background:${c.color}">${esc((c.name||'?')[0])}</div>
        <div class="mid"><div class="t">${esc(it.note||c.name)}</div><div class="s">${fmtDate(it.date)} · ${esc(c.name)}</div></div>
        <div class="val">−${fmt(it.amount)}</div>
        <button class="del" onclick="delItem('out','${it.id}')">×</button>
      </div>`;
    }).join('')
    :`<div class="empty"><span class="em-emoji">≣</span>Nothing logged this month yet.</div>`}
  `;
}

function viewInsights(){
  const t=totals();
  const sbc=spentByCat();
  const segs=DATA.categories.map(c=>({name:c.name,color:c.color,val:sbc[c.id]||0})).filter(s=>s.val>0).sort((a,b)=>b.val-a.val);
  const total=segs.reduce((s,x)=>s+x.val,0);
  const maxCmp=Math.max(t.income,t.spent,1);
  return `
    <div class="panel">
      <h3>Where your money went</h3>
      ${total>0?`<div class="donut-wrap">
        <div class="donut">${donutSVG(segs,total)}
          <div class="center"><div><div class="c-lab">Spent</div><div class="c-val">${fmt(total)}</div></div></div>
        </div>
        <div class="legend">${segs.map(s=>`<div class="li"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span><span class="pc">${Math.round(s.val/total*100)}%</span></div>`).join('')}</div>
      </div>`:`<div class="empty"><span class="em-emoji">◔</span>No spending to chart yet.</div>`}
    </div>
    <div class="panel">
      <h3>Income vs. spending</h3>
      <div class="cmp">
        <div class="col"><div class="v" style="color:var(--accent)">${fmt(t.income)}</div><div class="bar" style="height:${t.income/maxCmp*100}%;background:var(--accent)"></div><div class="l">Income</div></div>
        <div class="col"><div class="v" style="color:var(--warn)">${fmt(t.spent)}</div><div class="bar" style="height:${t.spent/maxCmp*100}%;background:var(--warn)"></div><div class="l">Spent</div></div>
        <div class="col"><div class="v" style="color:${t.left<0?'var(--danger)':'var(--ink)'}">${fmt(t.left)}</div><div class="bar" style="height:${Math.max(t.left,0)/maxCmp*100}%;background:${t.left<0?'var(--danger)':'var(--line-strong)'}"></div><div class="l">Net</div></div>
      </div>
    </div>
  `;
}

function donutSVG(segs,total){
  const r=52,c=2*Math.PI*r,size=140;
  let acc=0;
  const circles=segs.map(s=>{
    const len=s.val/total*c;
    const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}"
      stroke-dashoffset="${(-acc).toFixed(2)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>`;
    acc+=len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="20"/>
    ${circles}</svg>`;
}

/* ---------- formatting ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function todayInCur(){ const [y,m]=CUR.split('-'); const now=new Date(); const day=(monthKey(now)===CUR)?now.getDate():1; return `${y}-${m}-${String(day).padStart(2,'0')}`; }

/* ================= MODALS ================= */
function sheet(html){
  let s=document.getElementById('scrim');
  if(!s){ s=document.createElement('div'); s.id='scrim'; s.className='scrim'; s.onclick=e=>{if(e.target===s)closeSheet();}; document.body.appendChild(s); }
  s.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  requestAnimationFrame(()=>s.classList.add('show'));
}
function closeSheet(){ const s=document.getElementById('scrim'); if(s){ s.classList.remove('show'); setTimeout(()=>s.remove(),260);} }

/* --- add transaction --- */
function openAdd(){
  modalCtx={kind:'out',catId:DATA.categories[0]?.id};
  renderAdd();
}
function openCatLog(catId){ modalCtx={kind:'out',catId}; renderAdd(); }
function renderAdd(){
  const isOut=modalCtx.kind==='out';
  sheet(`
    <h3>Add ${isOut?'expense':'income'}</h3>
    <div class="seg">
      <button class="${isOut?'on':''}" onclick="modalCtx.kind='out';renderAdd()">Expense</button>
      <button class="${!isOut?'on':''}" onclick="modalCtx.kind='in';renderAdd()">Income</button>
    </div>
    <div class="field"><label class="fl">Amount</label>
      <input id="f-amt" class="amt-in mono" type="number" inputmode="decimal" placeholder="0.00" value="${modalCtx.amount||''}"></div>
    ${isOut?`
      <div class="field"><label class="fl">Category</label>
        <div class="chips" id="f-chips">${DATA.categories.map(c=>`<span class="chip ${modalCtx.catId===c.id?'on':''}" onclick="modalCtx.catId='${c.id}';renderAdd()"><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</span>`).join('')}</div></div>
      <div class="field"><label class="fl">Note (optional)</label><input id="f-note" placeholder="e.g. Weekly shop" value="${esc(modalCtx.note||'')}"></div>
    `:`
      <div class="field"><label class="fl">Source</label><input id="f-note" placeholder="e.g. Salary" value="${esc(modalCtx.note||'')}"></div>
    `}
    <div class="field"><label class="fl">Date</label><input id="f-date" type="date" value="${modalCtx.date||todayInCur()}"></div>
    <button class="btn" onclick="saveTx()">Save ${isOut?'expense':'income'}</button>
  `);
  setTimeout(()=>{const a=document.getElementById('f-amt'); if(a&&!modalCtx.amount)a.focus();},120);
}
function saveTx(){
  const amt=parseFloat(document.getElementById('f-amt').value);
  if(!amt||amt<=0){ toast('Enter an amount'); return; }
  const note=(document.getElementById('f-note')||{}).value||'';
  const date=document.getElementById('f-date').value||todayInCur();
  const m=curMonth();
  if(modalCtx.kind==='out'){
    if(!modalCtx.catId){ toast('Pick a category'); return; }
    m.expenses.push({id:uid(),catId:modalCtx.catId,amount:amt,note:note.trim(),date});
  }else{
    m.income.push({id:uid(),label:note.trim()||'Income',amount:amt,date});
  }
  saveStore(); closeSheet(); render(); toast('Saved');
}
function delItem(kind,id){
  const m=curMonth();
  if(kind==='in') m.income=m.income.filter(i=>i.id!==id);
  else m.expenses=m.expenses.filter(e=>e.id!==id);
  saveStore(); render(); toast('Deleted');
}

/* --- categories --- */
function openCats(){
  modalCtx={cats:DATA.categories.map(c=>({...c}))};
  renderCats();
}
function renderCats(){
  sheet(`
    <h3>Categories & budgets</h3>
    <div id="cat-list">${modalCtx.cats.map((c,i)=>`
      <div class="cat-edit">
        <span class="sw" style="background:${c.color}" onclick="cycleColor(${i})"></span>
        <input class="nm" value="${esc(c.name)}" oninput="modalCtx.cats[${i}].name=this.value">
        <input class="bd mono" type="number" inputmode="decimal" placeholder="budget" value="${c.budget||''}" oninput="modalCtx.cats[${i}].budget=parseFloat(this.value)||0">
        <button class="x" onclick="modalCtx.cats.splice(${i},1);renderCats()">×</button>
      </div>`).join('')}</div>
    <button class="add-cat" onclick="addCat()">+ Add category</button>
    <div style="height:14px"></div>
    <button class="btn" onclick="saveCats()">Save categories</button>
    <div class="note">Budgets are the monthly target for each envelope. Editing a budget applies to every month.</div>
  `);
}
function cycleColor(i){ const cur=PALETTE.indexOf(modalCtx.cats[i].color); modalCtx.cats[i].color=PALETTE[(cur+1)%PALETTE.length]; renderCats(); }
function addCat(){ modalCtx.cats.push({id:uid(),name:'New category',budget:0,color:PALETTE[modalCtx.cats.length%PALETTE.length]}); renderCats(); }
function saveCats(){
  DATA.categories=modalCtx.cats.filter(c=>c.name.trim()).map(c=>({...c,name:c.name.trim()}));
  if(!DATA.categories.length){ toast('Keep at least one category'); return; }
  saveStore(); closeSheet(); render(); toast('Categories saved');
}

/* --- settings --- */
function openSettings(){
  const CURR=[['€','EUR','de-DE'],['$','USD','en-US'],['£','GBP','en-GB'],['CHF','CHF','de-CH']];
  sheet(`
    <h3>Settings</h3>
    <div class="field"><label class="fl">Currency</label>
      <div class="chips">${CURR.map(c=>`<span class="chip ${DATA.settings.currency===c[1]?'on':''}" onclick="setCurrency('${c[0]}','${c[1]}','${c[2]}')">${c[0]} ${c[1]}</span>`).join('')}</div></div>
    <div class="field"><label class="fl">Manage</label>
      <button class="btn ghost" onclick="closeSheet();openCats()">Edit categories & budgets</button></div>
    <div class="field"><button class="btn danger" onclick="wipeMonth()">Clear this month's transactions</button></div>
    <button class="btn ghost" onclick="closeSheet()">Done</button>
    <div class="note">Your data is saved privately to this tracker and stays here between sessions.${typeof window.storage==='undefined'?'<br><b>Note:</b> persistent storage is unavailable in this preview, so data will reset when the page reloads.':''}</div>
  `);
}
function setCurrency(sym,code,loc){ DATA.settings={symbol:sym,currency:code,locale:loc}; saveStore(); openSettings(); render(); }
function wipeMonth(){ const m=curMonth(); m.income=[];m.expenses=[]; saveStore(); closeSheet(); render(); toast('Month cleared'); }

/* ================= INIT ================= */
(async function init(){
  const loaded=await loadStore();
  if(loaded&&loaded.categories){ DATA=loaded; }
  else{
    DATA={categories:DEFAULT_CATS.map(c=>({...c})),months:{},settings:{symbol:'€',currency:'EUR',locale:'de-DE'}};
    await saveStore();
  }
  if(!DATA.settings) DATA.settings={symbol:'€',currency:'EUR',locale:'de-DE'};
  render();
})();
</script>
